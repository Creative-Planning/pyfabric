[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfabric"
dynamic = ["version"]
description = "Python libraries helping AI coding assistants create and locally validate Microsoft Fabric items compatible with Fabric git sync."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Creative Planning", email = "20804442+hughdecatte@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["microsoft-fabric", "fabric", "git-sync", "copilot", "ai", "validation", "testing"]
dependencies = [
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/Creative-Planning/pyfabric"
Repository = "https://github.com/Creative-Planning/pyfabric"

[project.scripts]
pyfabric = "pyfabric.cli:main"

[project.entry-points.pytest11]
pyfabric = "pyfabric.testing.plugin"

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "requests>=2.32",
    # pyjwt is pulled in transitively via azure-identity -> msal. msal's
    # own constraint (PyJWT[crypto]>=1.0.0,<3) allows versions affected by
    # PYSEC-2026-175/177/178/179 (algorithm-confusion / unbounded JWKS
    # fetch; fixed in 2.13.0). Floor it here so a fresh install resolves a
    # patched pyjwt rather than the highest msal-permitted release.
    "pyjwt>=2.13.0",
]
data = [
    "pyodbc>=5.1",
    "azure-storage-file-datalake>=12.17",
    "pandas>=2.0",
]
# Runtime deps for pyfabric.data.lakehouse.write_table (Delta write path
# to OneLake). These are genuine runtime requirements of the write_table
# function, not testing-only — install them when you need to write Delta
# tables from a host that doesn't already have them. The `testing` extra
# includes this via pyfabric[lakehouse-io] for backwards compat.
lakehouse-io = [
    "deltalake>=0.21",
    "pyarrow>=17",
]
testing = [
    "pyfabric[lakehouse-io]",
    "duckdb>=1.1",
    "pytest>=8.0",
]
# Transport for querying published data agents over their MCP endpoint
# (pyfabric.testing.data_agent). Floor mcp at 1.23.0: CVE-2025-66416
# (DNS-rebinding protection off by default for HTTP-based servers) is
# fixed there — we only use the client side, but the floor keeps
# resolvers out of the advisory-affected range.
dataagent = [
    "mcp>=1.23.0",
]
# parameter.yml (find_replace) parsing for deploy.substitute_parameters.
# PyYAML has no transitive dependencies; floor at the current release
# (yaml.safe_load only — the historic PyYAML CVEs are full_load-only).
deploy = [
    "pyyaml>=6.0.2",
]
all = [
    "pyfabric[azure]",
    "pyfabric[data]",
    "pyfabric[lakehouse-io]",
    "pyfabric[testing]",
    "pyfabric[dataagent]",
    "pyfabric[deploy]",
]
dev = [
    "pyfabric[all]",
    "types-PyYAML>=6.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-json-report>=1.5",
    "allpairspy>=2.5",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "build>=1.2",
]

# -- Hatch version from git tags ------------------------------------------

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pyfabric/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfabric"]
# Non-.py files under src/pyfabric/ (e.g. claude_memory/*.md, py.typed) are
# included automatically by hatchling. `pyfabric install-claude-memory`
# relies on the claude_memory/ .md files shipping with the wheel.

# -- Ruff ------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
extend-exclude = [
    # Fabric notebook fixtures contain raw cell-marker syntax (e.g.
    # ``%pip install ...``) that isn't valid Python. They exist to be
    # parsed as bytes by NotebookBuilder tests, not run as scripts.
    "tests/fixtures/notebooks/**/notebook-content.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.lint.isort]
known-first-party = ["pyfabric"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# -- Mypy ------------------------------------------------------------------

[tool.mypy]
# 3.12, not the 3.11 floor: numpy >= 2.5 stubs use PEP 695 `type`
# statements, which mypy refuses to PARSE under python_version = "3.11"
# ("Type statement is only supported in Python 3.12 and greater") —
# numpy's stubs get pulled into the build via pandas/pyarrow even though
# pyfabric never imports numpy, and neither ignore_missing_imports nor
# follow_imports = "skip" prevents the parse (verified). Runtime 3.11
# compatibility is still covered by the CI test matrix (3.11/3.12/3.13).
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party libraries without type stubs. mcp is additionally an
# optional extra (pyfabric[dataagent]) that isn't installed in the dev
# env at all — the import lives behind a lazy try/except.
[[tool.mypy.overrides]]
module = ["requests.*", "pyodbc.*", "pyarrow.*", "pandas.*", "duckdb.*", "structlog.*", "deltalake.*", "mcp.*"]
ignore_missing_imports = true

# pyarrow ships partial type info — on Linux, mypy --strict sees
# pyarrow.parquet.write_table (and friends) as untyped functions and
# fires ``no-untyped-call``; on Windows, mypy can't introspect the
# compiled extensions and falls back to Any via the override above.
# These modules call into pyarrow.parquet directly; loosening just
# them avoids both branches of that platform divergence without
# weakening strict typing anywhere else.
[[tool.mypy.overrides]]
module = ["pyfabric.testing.fixtures", "pyfabric.data.open_mirror"]
disallow_untyped_calls = false

# Ported fabric-libs modules — strict typing will be added iteratively.
# Remove modules from this list as they get proper type annotations.
[[tool.mypy.overrides]]
module = [
    "pyfabric.client.auth",
    "pyfabric.client.http",
    "pyfabric.client.graph",
    "pyfabric.client.livy",
    "pyfabric.client.ontology",
    "pyfabric.client.ontology.*",
    "pyfabric.client.ontology_sync",
    "pyfabric.data.*",
    "pyfabric.workspace.*",
    "pyfabric.items.bundle",
    "pyfabric.items.crud",
    "pyfabric.cli",
]
ignore_errors = true

# -- Pytest ----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--json-report",
    "--json-report-file=.test-report.json",
]
xfail_strict = true
markers = [
    "e2e: end-to-end tests requiring PYFABRIC_TEST_WORKSPACE env var",
]

# -- Coverage --------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/pyfabric"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
